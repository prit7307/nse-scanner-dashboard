name: Daily Bhavcopy & Metrics Sync

on:
  schedule:
    # 13:00 UTC = 18:30 IST (Monday through Friday)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual run button

permissions:
  contents: write

jobs:
  sync-nse-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sync Script
        run: python update_data.py

      - name: Commit and Push Updated Parquet History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nse_rolling_60d.parquet
          if git diff --staged --quiet; then
            echo "No changes to commit. Data is already up to date."
          else
            git commit -m "Automated daily NSE data sync [skip ci]"
            git push origin main
          fi
