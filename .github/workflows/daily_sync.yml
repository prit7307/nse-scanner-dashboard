name: Daily Bhavcopy & Metrics Sync

on:
  schedule:
    # 13:00 UTC = 18:30 IST (Monday through Friday)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual run button

permissions:
  contents: write

jobs:
  sync-nse-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Holiday-Resilient Sync Script
        run: python update_data.py

      - name: Commit and Push Updated Parquet Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated daily NSE update [skip ci]"
          file_pattern: "data/*"
