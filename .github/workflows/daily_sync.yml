name: Daily Bhavcopy & Metrics Sync

on:
  schedule:
    # 13:00 UTC = 18:30 IST (Monday through Friday)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub

permissions:
  contents: write # Allows GitHub Actions to commit updated data

jobs:
  sync-nse-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Holiday-Resilient Sync Script
        run: python update_data.py

      - name: Commit and Push Updated Parquet History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nse_rolling_60d.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily NSE update [skip ci]" && git push)
